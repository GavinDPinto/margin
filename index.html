<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Margin">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Margin</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --faint:#a1a1a6;
  --line:#e4e2db; --line2:#d6d3ca; --accent:#2d5be3; --accent-soft:#e9effd; --danger:#d0362b;
  --desk:#e8e6e0; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0}
[hidden]{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line2)}
.btn:active{background:#f1f0ec}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:active{background:#244bc0}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;padding:0 8px;color:var(--accent)}
.btn.ghost:active{background:var(--accent-soft)}
.btn .ic{width:18px;height:18px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;color:var(--ink)}
.ibtn:active,.ibtn.on{background:#efeee9}
.ibtn:disabled{opacity:.3;cursor:default}
.sel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font-size:14px}

/* ---------- library ---------- */
#library{background:var(--bg)}
.lib-head{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 14px) calc(var(--sar) + 20px) 10px calc(var(--sal) + 20px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:21px;letter-spacing:-.02em;margin-right:auto}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(150deg,#3a67ee,#1f3fa6);position:relative;box-shadow:inset 0 -1px 0 rgba(0,0,0,.15)}
.brand-mark svg{position:absolute;inset:5px;width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);width:min(300px,34vw);color:var(--muted)}
.search .ic{width:17px;height:17px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.lib-bar{display:flex;align-items:center;gap:12px;padding:4px calc(var(--sar) + 20px) 12px calc(var(--sal) + 20px);flex-wrap:wrap}
#crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;font-size:22px;font-weight:650;letter-spacing:-.015em;overflow:hidden}
#crumbs button{padding:2px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#crumbs button.up{color:var(--muted);font-weight:500;font-size:17px}
#crumbs button:active{background:#ebe9e3}
#crumbs .chev{color:var(--faint);font-weight:400;font-size:18px}
.lib-actions{display:flex;gap:8px}
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px calc(var(--sar) + 20px) calc(var(--sab) + 40px) calc(var(--sal) + 20px)}
.sec-h{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.tiles.folders{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
.tile.folder{display:flex;align-items:center;gap:12px;padding:12px 40px 12px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.tile.folder:active{background:#f3f2ee}
.ficon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ficon .ic{width:22px;height:22px;stroke-width:1.9}
.tmeta{min-width:0}
.tname{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.note .thumb{aspect-ratio:8.5/11;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px -8px rgba(0,0,0,.12);transition:transform .12s}
.tile.note:active .thumb{transform:scale(.98)}
.tile.note .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tile.note .tmeta{padding:9px 30px 0 2px}
.tile .more{position:absolute;right:6px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tile.folder .more{top:50%;transform:translateY(-50%)}
.tile.note .more{bottom:2px;right:-2px}
.tile .more:active{background:#ebe9e3}
.empty{margin:70px auto;text-align:center;color:var(--muted);max-width:340px}
.empty .big{font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:16px}

/* paper previews */
.pv{background:#fff}
.pv-lined{background:#fff repeating-linear-gradient(180deg,transparent 0 9px,rgba(70,120,190,.32) 9px 10px) 0 14px/100% 100% no-repeat}
.pv-grid{background-color:#fff;background-image:linear-gradient(rgba(60,90,130,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,130,.18) 1px,transparent 1px);background-size:8px 8px}
.pv-dotted{background-color:#fff;background-image:radial-gradient(circle,rgba(60,70,90,.45) .9px,transparent 1.2px);background-size:8px 8px}
.pv-blank{background:#fff}

/* ---------- editor ---------- */
#editor{background:var(--desk)}
.ed-top{display:flex;align-items:center;gap:2px;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 6px);background:var(--panel);border-bottom:1px solid var(--line)}
.ed-top .sp{flex:1}
.ed-title{border:0;outline:0;background:transparent;font-weight:600;font-size:16px;padding:6px 8px;border-radius:8px;min-width:60px;width:38vw;max-width:460px;text-overflow:ellipsis}
.ed-title:focus{background:#f3f2ee}
.ed-tools{display:flex;align-items:center;gap:6px;padding:5px calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);background:var(--panel);
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-user-select:none;user-select:none;flex:none}
.ed-tools::-webkit-scrollbar{display:none}
.tgroup{display:flex;align-items:center;gap:3px;flex:none}
.tdiv{width:1px;height:24px;background:var(--line);margin:0 5px;flex:none}
.tool{width:42px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;color:#3a3a3c}
.tool .ic{width:22px;height:22px}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .dot{position:absolute;bottom:4px;left:50%;width:14px;height:3px;border-radius:2px;transform:translateX(-50%)}
.sw{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.sw i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.custom i{background:conic-gradient(#f44,#fd4,#4d6,#4cf,#46f,#c4f,#f44)}
.sw.custom.on i{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 0 0 4px #fff}
.sz{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.sz.on{background:#efeee9}
.sz b{display:block;border-radius:50%;background:#2c2c2e}
.sz.er b{background:transparent;border:1.5px solid #2c2c2e}
.sz.tx{font-weight:600;color:#2c2c2e}
.szval{min-width:44px;height:32px;padding:0 8px;border-radius:9px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:4px}
.seg{display:flex;background:#efeee9;border-radius:9px;padding:2px}
.seg button{height:30px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:500;color:#48484a;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 4px}

#scroller{flex:1;overflow:auto;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
#pages{position:relative;padding:22px 22px calc(90px + var(--sab));min-width:100%;width:max-content}
.page{position:relative;margin:0 auto 22px;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.05),0 8px 24px -6px rgba(0,0,0,.10)}
.page > canvas{position:absolute;left:0;top:0;display:block;pointer-events:none}
canvas.live{z-index:1}
.tlayer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:2}
.tool-text .tlayer{pointer-events:auto;cursor:text}
.tbox{position:absolute;min-height:1.3em;line-height:1.3;padding:2px 4px;outline:none;white-space:pre-wrap;overflow-wrap:break-word;
  -webkit-user-select:text;user-select:text;font-family:var(--font);border-radius:3px;cursor:text}
.tool-text .tbox{box-shadow:0 0 0 1px rgba(45,91,227,.22)}
.tbox:focus{box-shadow:0 0 0 1.5px var(--accent)!important;background:rgba(255,255,255,.55)}
.sel-bar{position:absolute;z-index:5;display:flex;gap:2px;padding:4px;border-radius:12px;background:#1f1f21;color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap}
.sel-bar.below{transform:translate(-50%,10px)}
.sel-bar button{height:34px;padding:0 11px;border-radius:8px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.sel-bar button:active{background:rgba(255,255,255,.14)}
.sel-bar .ic{width:17px;height:17px}
#page-ind{position:absolute;left:50%;bottom:calc(var(--sab) + 14px);transform:translateX(-50%);background:rgba(30,30,32,.78);color:#fff;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:20px;pointer-events:none;font-variant-numeric:tabular-nums;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .3s;opacity:.0}
#page-ind.show{opacity:1}

/* ---------- popover menu ---------- */
.pop{position:fixed;z-index:60;background:var(--panel);border-radius:14px;padding:6px;min-width:220px;
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 12px 36px rgba(0,0,0,.18);animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.pop .mi{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 10px;border-radius:9px;font-size:14.5px;text-align:left}
.pop .mi:active,.pop .mi:hover{background:#f2f1ed}
.pop .mi.danger{color:var(--danger)}
.pop .mi .ic{width:19px;height:19px;color:var(--muted)}
.pop .mi.danger .ic{color:var(--danger)}
.pop .mi .r{margin-left:auto;color:var(--muted);font-size:13px}
.pop hr{border:0;height:1px;background:var(--line);margin:5px 6px}
.pop .slider{padding:10px 12px 8px;display:flex;align-items:center;gap:12px;min-width:260px}
.pop input[type=range]{flex:1;accent-color:var(--accent)}
.pop .slider output{min-width:36px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.pop .swgrid{display:grid;grid-template-columns:repeat(6,30px);gap:6px;padding:6px}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(20,20,22,.32);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border-radius:18px;width:min(420px,100%);max-height:calc(100% - 40px);display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pop .15s ease-out}
.modal.wide{width:min(560px,100%)}
.modal h3{margin:0;padding:20px 22px 4px;font-size:18px;letter-spacing:-.01em}
.mbody{padding:10px 22px 6px;overflow:auto}
.mbody p{margin:4px 0 8px;color:#3a3a3c}
.mbtns{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px}
.inp{width:100%;height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;font-size:16px;outline:0;background:#fff}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.lbl:first-child{margin-top:4px}
.tpl-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tpl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#3a3a3c}
.tpl .pv{width:100%;aspect-ratio:8.5/11;border-radius:8px;border:1px solid var(--line2)}
.tpl.on .pv{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tpl.on{color:var(--accent)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 6px;border-radius:17px;border:1px solid var(--line2);font-size:13.5px}
.chip i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.chip.dotonly{padding:0 6px}
.radio-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px}
.radio-list button{display:flex;align-items:center;gap:9px;height:40px;border-radius:8px;padding:0 10px;text-align:left;font-size:14.5px}
.radio-list button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.radio-list button:disabled{opacity:.35}
.radio-list .ic{width:18px;height:18px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row .t{font-weight:500}
.switch-row .d{font-size:13px;color:var(--muted)}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:#e3e2dd;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:#34c759}
.switch.on::after{transform:translateX(20px)}
.progress{height:6px;border-radius:3px;background:#ecebe6;overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.muted{color:var(--muted);font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translate(-50%,20px);background:#1f1f21;color:#fff;padding:10px 16px;border-radius:12px;
  font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(520px,calc(100% - 40px));text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.color-input{position:fixed;width:1px;height:1px;opacity:0;border:0;padding:0;left:0;top:0;pointer-events:none}

@media (max-width:640px){
  .lib-actions .btn span{display:none}
  .search{width:auto;flex:1}
  .brand{margin-right:0}
  .ed-title{width:30vw}
}

/* paper picker */
.pp{display:flex;gap:22px;align-items:flex-start}
.pp-ctl{flex:1;min-width:0}
.pp-prev{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:30px;position:sticky;top:0}
.pp-prev canvas{border-radius:8px;box-shadow:0 0 0 1px var(--line2),0 6px 18px -8px rgba(0,0,0,.25)}
.pp-slider{display:flex;align-items:center;gap:12px;margin-top:10px}
.pp-slider input{flex:1;accent-color:var(--accent)}
.pp-slider output{min-width:58px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:600px){.pp{flex-direction:column-reverse}.pp-prev{position:static;margin:0 auto}}
/* destination picker */
.dest-new{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);text-align:left}
.dest-new .ic{width:24px;height:24px;color:var(--accent)}
.dest-new b,.dest-row b{display:block;font-size:14.5px;font-weight:600}
.dest-new small,.dest-row small{display:block;font-size:12.5px;color:var(--muted)}
.dest-new:active,.dest-row:active,.dest-row:hover{background:#f3f2ee}
.dest-q{margin-bottom:8px}
.dest-list{display:flex;flex-direction:column;gap:2px;max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px}
.dest-row{display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:9px;text-align:left;width:100%}
.dest-row img,.dest-row .pv{width:34px;height:44px;border-radius:4px;border:1px solid var(--line);object-fit:cover;object-position:top;flex:none}
.dest-row .dm{min-width:0;flex:1}
.dest-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-add{font-size:13px;font-weight:600;color:var(--accent);padding:0 6px}
/* drag & drop */
#drop-ov{position:fixed;inset:10px;z-index:70;border:2.5px dashed var(--accent);border-radius:20px;background:rgba(45,91,227,.07);display:flex;align-items:flex-end;justify-content:center;padding-bottom:44px;pointer-events:none}
#drop-ov span{background:var(--accent);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(45,91,227,.35)}
.tile.note.drop-hover .thumb{box-shadow:0 0 0 3px var(--accent);transform:scale(1.02)}

/* selection handles, crop, paste */
.sel-handle,.crop-handle{position:absolute;z-index:6;width:36px;height:36px;margin:-18px 0 0 -18px;display:flex;align-items:center;justify-content:center;touch-action:none}
.sel-handle::after{content:"";width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.crop-handle::after{content:"";width:18px;height:18px;background:#fff;border:2px solid #1f1f21;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.h-tl,.h-br{cursor:nwse-resize}.h-tr,.h-bl{cursor:nesw-resize}
.sel-bar .accent{background:var(--accent)}
.sel-bar.crop-bar{transform:translate(-50%,-100%)}
.sel-bar.crop-bar.below{transform:translate(-50%,0)}
.sel-bar.paste-bar{transform:translate(-50%,-100%)}
.sel-bar button{touch-action:manipulation}

</style>
</head>
<body>

<!-- ============ LIBRARY ============ -->
<section id="library" class="view">
  <header class="lib-head">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/></svg></span>Margin</div>
    <label class="search"><svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search notes" autocomplete="off"></label>
    <select id="sort" class="sel" aria-label="Sort">
      <option value="updated">Last edited</option>

/* =====================================================================

   ===================================================================== */
const DB = {
  db: null, mem: null,
  async open() {
    try {
      if (!window.indexedDB) throw new Error('no indexedDB');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('margin-notes', 1);
        r.onupgradeneeded = () => { const d = r.result; for (const n of ['folders', 'notes', 'pages', 'blobs']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); };

  _tx(store, mode, fn) {

/* background images (PDF pages / imported images) */
const bgCache = new Map(), bgLoading = new Map(), bgFailed = new Set();
function loadBg(id) {
  if (bgCache.has(id)) { const v = bgCache.get(id); bgCache.delete(id); bgCache.set(id, v); return Promise.resolve(v); }
  if (bgLoading.has(id)) return bgLoading.get(id);
  const p = (async () => {
    const rec = await DB.get('blobs', id);
    if (!rec) { bgFailed.add(id); return null; }
    const url = URL.createObjectURL(new Blob([rec.data], { type: rec.type || 'image/jpeg' }));
    const img = new Image(); img.src = url;
    try { await img.decode(); } catch (e) { await new Promise(r => { if (img.complete) r(); else { img.onload = r; img.onerror = r; } }); }
    if (!img.naturalWidth) { bgFailed.add(id); URL.revokeObjectURL(url); return null; }
    img._url = url; bgCache.set(id, img);
    while (bgCache.size > 40) { const k = bgCache.keys().next().value; const old = bgCache.get(k); bgCache.delete(k); try { URL.revokeObjectURL(old._url); } catch (e) {} }
    return img;
  })();
  bgLoading.set(id, p);
  p.finally(() => bgLoading.delete(id));
  return p;
}

function popover(anchor, content, opts = {}) {

  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  let x = opts.alignRight ? r.right - pw : r.left + r.width / 2 - pw / 2;
  let y = r.bottom + 6;
  if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 6);
  p.style.left = clamp(x, 8, innerWidth - pw - 8) + 'px'; p.style.top = y + 'px';
  openPop = p;

  p.addEventListener('pointerdown', e => { if (!e.target.closest('input')) e.preventDefault(); });
  return p;
}
function menu(anchor, items, opts) {

}

function modal({ title, body, buttons = [], onOpen, wide, dismissable = true }) {
  return new Promise(resolve => {
    closePop();
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${title ? `<h3>${esc(title)}</h3>` : ''}<div class="mbody"></div><div class="mbtns"></div></div>`;
    const mb = $('.mbody', back);
    if (typeof body === 'string') mb.innerHTML = body; else if (body) mb.appendChild(body);
    if (!buttons.length) $('.mbtns', back).remove();
    let done = false;
    const close = r => { if (done) return; done = true; back.remove(); document.removeEventListener('keydown', kd, true); resolve(r); };
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '');
      btn.textContent = b.label;
      btn.addEventListener('click', () => { const r = typeof b.value === 'function' ? b.value(back) : b.value; if (r === false) return; close(r); });
      $('.mbtns', back).appendChild(btn);
    });

      if (e.key === 'Escape' && dismissable) { e.preventDefault(); close(null); }

    };
    document.addEventListener('keydown', kd, true);
    if (dismissable) back.addEventListener('pointerdown', e => { if (e.target === back) close(null); });
    document.body.appendChild(back);
    onOpen && onOpen(back, close);
  });
}

function paperPicker(init) {
  const el = document.createElement('div'); el.className = 'pp';
  const st = { tpl: init.tpl || 'lined', paper: init.paper || 'white', ink: init.ink || 'normal', spacing: { ...SET.spacing, ...(init.spacing || {}) } };
  const draw = () => {
    const sp = SPACING[st.tpl], val = sp ? st.spacing[st.tpl] : 0;
    el.innerHTML = `<div class="pp-ctl">
      <label class="lbl">Template</label><div class="tpl-pick">${TEMPLATES.map(t => `<button class="tpl ${t.id === st.tpl ? 'on' : ''}" data-t="${t.id}"><span class="pv pv-${t.id}" style="background-color:${PAPERS[st.paper][0]}"></span>${t.name}</button>`).join('')}</div>
      ${sp ? `<label class="lbl">${st.tpl === 'lined' ? 'Line spacing' : st.tpl === 'grid' ? 'Square size' : 'Dot spacing'}</label>
        <div class="chips">${sp.presets.map(([v, n]) => `<button class="chip ${v === val ? 'on' : ''}" data-sp="${v}">${n}</button>`).join('')}</div>
        <div class="pp-slider"><input type="range" min="${sp.min}" max="${sp.max}" step="1" value="${val}" data-sprange><output>${(val / 96 * 25.4).toFixed(1)} mm</output></div>
        <label class="lbl">Line strength</label><div class="chips">${Object.entries(INKS).map(([k, v]) => `<button class="chip ${k === st.ink ? 'on' : ''}" data-ink="${k}">${v[1]}</button>`).join('')}</div>` : ''}
      <label class="lbl">Paper colour</label><div class="chips">${Object.entries(PAPERS).map(([k, v]) => `<button class="chip ${k === st.paper ? 'on' : ''}" data-p="${k}"><i style="background:${v[0]}"></i>${v[1]}</button>`).join('')}</div>
    </div><div class="pp-prev"><canvas></canvas><span class="muted">Preview</span></div>`;
    preview();
  };
  const preview = () => {
    const c = $('.pp-prev canvas', el); if (!c) return;
    const W = 168, k = W / PAGE_W * dpr();
    c.width = Math.round(PAGE_W * k); c.height = Math.round(PAGE_H * k); c.style.width = W + 'px'; c.style.height = Math.round(W * PAGE_H / PAGE_W) + 'px';
    const ctx = c.getContext('2d'); ctx.setTransform(k, 0, 0, k, 0, 0);
    // preview a zoomed crop so spacing differences are visible
    ctx.save(); ctx.scale(2, 2);
    drawPaper(ctx, { w: PAGE_W / 2 + 1, h: PAGE_H / 2 + 1, template: st.tpl, paper: st.paper, spacing: st.spacing[st.tpl], ink: st.ink });
    ctx.restore();
  };
  draw();
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-t]'), pp = e.target.closest('[data-p]'), sp = e.target.closest('[data-sp]'), ik = e.target.closest('[data-ink]');
    if (t) st.tpl = t.dataset.t; if (pp) st.paper = pp.dataset.p; if (ik) st.ink = ik.dataset.ink;
    if (sp) st.spacing[st.tpl] = +sp.dataset.sp;
    if (t || pp || sp || ik) draw();
  });
  el.addEventListener('input', e => {
    if (!e.target.matches('[data-sprange]')) return;
    const v = +e.target.value; st.spacing[st.tpl] = v;
    $('.pp-slider output', el).textContent = (v / 96 * 25.4).toFixed(1) + ' mm';
    $$('[data-sp]', el).forEach(b => b.classList.toggle('on', +b.dataset.sp === v));
    preview();
  });
  return { el, get: () => ({ tpl: st.tpl, paper: st.paper, ink: st.ink, spacingAll: { ...st.spacing }, spacing: SPACING[st.tpl] ? st.spacing[st.tpl] : null }) };
}
function rememberStyle(r) { SET.template = r.tpl; SET.paper = r.paper; SET.ink = r.ink; SET.spacing = { ...SET.spacing, ...r.spacingAll }; saveSettings(); }

const L = { cwd: null, q: '', folders: [], notes: [] };

async function refreshLib() {
  L.folders = await DB.all('folders');
  L.notes = await DB.all('notes');
  if (L.cwd && !L.folders.find(f => f.id === L.cwd)) L.cwd = null;
  renderLib();
}
const folderById = id => L.folders.find(f => f.id === id);
function folderPath(id) { const out = []; let f = folderById(id), guard = 0; while (f && guard++ < 50) { out.unshift(f); f = folderById(f.parentId); } return out; }
function descendants(fid) { const out = []; const walk = id => L.folders.filter(f => f.parentId === id).forEach(f => { out.push(f); walk(f.id); }); walk(fid); return out; }
function fmtDate(t) {
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return 'Today ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric' });
}
function sortNotes(arr) {
  const s = SET.sort;
  return arr.slice().sort((a, b) => s === 'name' ? a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }) : s === 'created' ? b.created - a.created : b.updated - a.updated);
}

function renderLib() {
  // crumbs
  const cr = $('#crumbs');
  if (L.q) cr.innerHTML = `<button data-crumb="">Search results</button>`;
  else {
    const path = folderPath(L.cwd);
    let h = `<button data-crumb="" class="${path.length ? 'up' : ''}">All Notes</button>`;
    path.forEach((f, i) => { h += `<span class="chev">›</span><button data-crumb="${f.id}" class="${i < path.length - 1 ? 'up' : ''}">${esc(f.name)}</button>`; });
    cr.innerHTML = h;
  }
  const g = $('#grid');
  let folders, notes;
  if (L.q) {
    const q = L.q.toLowerCase();
    folders = L.folders.filter(f => f.name.toLowerCase().includes(q));
    notes = L.notes.filter(n => (n.title || '').toLowerCase().includes(q));
  } else {
    folders = L.folders.filter(f => (f.parentId || null) === L.cwd);
    notes = L.notes.filter(n => (n.folderId || null) === L.cwd);
  }
  folders.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
  notes = sortNotes(notes);
  let h = '';
  if (folders.length) {
    h += `<div class="sec-h">Folders</div><div class="tiles folders">` + folders.map(f => {
      const nc = L.notes.filter(n => n.folderId === f.id).length, fc = L.folders.filter(x => x.parentId === f.id).length;
      const sub = [nc ? `${nc} note${nc > 1 ? 's' : ''}` : '', fc ? `${fc} folder${fc > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ') || 'Empty';
      return `<div class="tile folder" data-fid="${f.id}"><div class="ficon" style="background:${f.color}1f;color:${f.color}">${icon('folder')}</div><div class="tmeta"><div class="tname">${esc(f.name)}</div><div class="tsub">${sub}</div></div><button class="more" data-fmenu="${f.id}" data-popanchor aria-label="Folder options">${icon('more')}</button></div>`;
    }).join('') + `</div>`;
  }
  if (notes.length) {
    h += `<div class="sec-h">${folders.length ? 'Notes' : (L.q ? 'Notes' : 'Notes')}</div><div class="tiles">` + notes.map(n => {
      const where = L.q && n.folderId ? ` · ${esc((folderById(n.folderId) || {}).name || '')}` : '';
      const th = n.thumb ? `<img src="${n.thumb}" alt="" loading="lazy">` : `<div class="pv pv-${n.template || 'lined'}" style="width:100%;height:100%;background-color:${(PAPERS[n.paper] || PAPERS.white)[0]}"></div>`;
      return `<div class="tile note" data-nid="${n.id}"><div class="thumb">${th}</div><div class="tmeta"><div class="tname">${esc(n.title || 'Untitled')}</div><div class="tsub">${fmtDate(n.updated)}${where}</div></div><button class="more" data-nmenu="${n.id}" data-popanchor aria-label="Note options">${icon('more')}</button></div>`;
    }).join('') + `</div>`;
  }
  if (!folders.length && !notes.length) {
    h = L.q ? `<div class="empty"><div class="big">No matches</div>Nothing found for “${esc(L.q)}”.</div>`
      : `<div class="empty"><div class="big">${L.cwd ? 'This folder is empty' : 'No notes yet'}</div>Create a note, add a folder, or import a PDF to mark up.<br><button class="btn primary" data-act="new-note">${icon('plus')}New Note</button></div>`;
  }

}

async function deleteNoteData(id) {
  const meta = await DB.get('notes', id), rec = await DB.get('pages', id);
  const blobs = new Set((meta && meta.blobs) || []);
  if (rec) rec.pages.forEach(p => { if (p.bg) blobs.add(p.bg); (p.images || []).forEach(im => blobs.add(im.b)); });
  for (const b of blobs) await DB.del('blobs', b);
  await DB.del('pages', id); await DB.del('notes', id);

async function duplicateNote(id) {
  const meta = await DB.get('notes', id), rec = await DB.get('pages', id);
  if (!meta) return;
  const map = new Map(), newBlobs = [];
  const pages = (rec ? rec.pages : []).map(p => ({ ...p, id: uid(), strokes: p.strokes.slice(), texts: (p.texts || []).map(t => ({ ...t, id: uid() })), images: (p.images || []).map(im => ({ ...im, id: uid() })) }));
  const remap = async id => {
    if (!map.has(id)) { const b = await DB.get('blobs', id); if (b) { const nid = uid(); await DB.put('blobs', { ...b, id: nid }); map.set(id, nid); newBlobs.push(nid); } }
    return map.get(id) || id;
  };
  for (const p of pages) { if (p.bg) p.bg = await remap(p.bg); for (const im of p.images) im.b = await remap(im.b); }
  const t = now();
  const m2 = { ...meta, id: uid(), title: meta.title + ' copy', created: t, updated: t, blobs: newBlobs };
  await DB.put('pages', { id: m2.id, pages }); await DB.put('notes', m2);
}

const isImportable = f => !!f && (f.type === 'application/pdf' || /^image\//.test(f.type) || /\.(pdf|png|jpe?g|gif|webp|heic|heif)$/i.test(f.name || ''));
const stripExt = n => (n || 'Imported').replace(/\.(pdf|png|jpe?g|heic|heif|webp|gif)$/i, '') || 'Imported';
const folderLabel = id => id ? ((folderById(id) || {}).name || 'All Notes') : 'All Notes';
function chooseDestination(files) {

  const notes = L.notes.slice().sort((a, b) => b.updated - a.updated);

    <div class="dest-list"></div>`;

      : `<div class="muted" style="padding:14px">No matching notes</div>`;
  };
  draw();
  return modal({ title: `Add ${what}`, body, wide: true, buttons: [{ label: 'Cancel', value: null }], onOpen: (b, close) => {
    $('.dest-q', b).addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); draw(); });
    b.addEventListener('click', e => {
      if (e.target.closest('[data-new]')) close({ mode: 'new' });
      const r = e.target.closest('.dest-row'); if (r) close({ mode: 'existing', id: r.dataset.id });
    });

let ingesting = false;
const isPdfFile = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
async function ingestFiles(fileList, opts = {}) {
  let files = [...fileList].filter(isImportable);
  if (opts.dest && opts.dest.mode === 'open' && E.open && !opts.asPages) {
    const imgs = files.filter(f => !isPdfFile(f)); files = files.filter(isPdfFile);
    if (imgs.length) await insertImages(imgs);
    if (!files.length) return;
  }
  if (!files.length) { toast('Margin can import PDFs and images'); return; }
  if (ingesting) return; ingesting = true;
  try {
    let dest = opts.dest;
    if (!dest) {
      L.notes = await DB.all('notes'); L.folders = await DB.all('folders');
      dest = L.notes.length ? await chooseDestination(files) : { mode: 'new' };
    }
    if (!dest) return;
    const intoOpen = E.open && (dest.mode === 'open' || (dest.mode === 'existing' && E.note && E.note.id === dest.id));
    const pg = progressBox(intoOpen || dest.mode === 'existing' ? 'Adding pages' : 'Importing');
    let pages = [];
    try {
      for (let i = 0; i < files.length; i++) {
        const f = files[i], pre = files.length > 1 ? `File ${i + 1} of ${files.length} · ` : '';
        pages = pages.concat(await fileToPages(f, (a, n) => pg.set(`${pre}page ${a} of ${n}`, (i + a / n) / files.length)));
      }
    } finally { pg.close(); }
    if (!pages.length) return;
    const blobs = pages.map(p => p.bg).filter(Boolean);
    const plural = `${pages.length} page${pages.length === 1 ? '' : 's'}`;
    if (intoOpen) { await insertIntoOpen(pages); toast(`Added ${plural}`); return; }
    if (E.open) await closeNote();
    if (dest.mode === 'new') {
      const meta = await createNote({ title: stripExt(files[0].name), template: SET.template, paper: SET.paper, pages, blobs });
      await refreshLib(); await openNote(meta.id); toast(`Created “${meta.title}”`);
    } else {
      const meta = await DB.get('notes', dest.id), rec = await DB.get('pages', dest.id);
      if (!meta) { toast('That note no longer exists'); return; }
      const existing = (rec && rec.pages) || [], at = existing.length;
      await DB.put('pages', { id: meta.id, pages: existing.concat(pages) });
      meta.blobs = [...(meta.blobs || []), ...blobs]; meta.updated = now(); await DB.put('notes', meta);
      await refreshLib(); await openNote(meta.id); scrollToPage(at);
      toast(`Added ${plural} to “${meta.title}”`);
    }

  $('#ed-addpage').addEventListener('click', addPage);
  $('#ed-more').addEventListener('click', e => editorMenu(e.currentTarget));
  $('#ed-title').addEventListener('input', e => { if (E.note) { E.note.title = e.target.value.trim() || 'Untitled'; E.dirty = true; clearTimeout(E.saveT); E.saveT = setTimeout(saveNote, 700); } });
  $('#ed-title').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  [$('#ed-undo'), $('#ed-redo'), $('#ed-addpage')].forEach(b => b.addEventListener('pointerdown', e => e.preventDefault()));
  bindToolbar();
  const s = sc();
  s.addEventListener('pointerdown', onPointerDown);
  s.addEventListener('pointermove', onPointerMove);
  s.addEventListener('pointerup', onPointerUp);
  s.addEventListener('pointercancel', onPointerUp);
  s.addEventListener('lostpointercapture', e => { if (D.active && e.pointerId === D.pid && e.pointerType !== 'touch') endDraw(null, true); });
  // stop iOS from scrolling / magnifying under the Pencil
  const stylusGuard = e => { if (E.tool === 'text' && !D.active) return; for (const t of e.changedTouches) if (t.touchType === 'stylus') { e.preventDefault(); return; } };
  s.addEventListener('touchstart', stylusGuard, { passive: false });
  s.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('.tbox') && !D.active) return; e.preventDefault(); }, { passive: false });
  s.addEventListener('scroll', () => { requestAnimationFrame(updIndicator); }, { passive: true });
  s.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    zoomAround(E.s * Math.exp(-clamp(e.deltaY, -25, 25) * 0.012), e.clientX, e.clientY);
  }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('keydown', e => {
    if (!E.open) return;
    const typing = e.target.closest && e.target.closest('input, textarea, [contenteditable]:not([contenteditable="false"])');
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
    if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); const r = sc().getBoundingClientRect(); zoomAround(E.s * 1.2, r.left + r.width / 2, r.top + r.height / 2); return; }
    if (mod && e.key === '-') { e.preventDefault(); const r = sc().getBoundingClientRect(); zoomAround(E.s / 1.2, r.left + r.width / 2, r.top + r.height / 2); return; }
    if (mod && e.key === '0') { e.preventDefault(); setScale(fitScale()); return; }
    if (mod && !typing && e.key.toLowerCase() === 'c' && E.sel) { e.preventDefault(); copySelection(); toast('Copied'); return; }
    if (mod && !typing && e.key.toLowerCase() === 'x' && E.sel) { e.preventDefault(); selAction('cut'); return; }
    if (mod && !typing && e.key.toLowerCase() === 'v' && E.clip) { clearTimeout(E.pasteT); E.pasteT = setTimeout(() => pasteClip(currentView()), 80); return; }
    if (typing || mod) return;
    const map = { p: 'pen', h: 'hl', e: 'eraser', l: 'lasso', t: 'text' };
    if (map[e.key.toLowerCase()]) { setTool(map[e.key.toLowerCase()]); return; }
    if ((e.key === 'Backspace' || e.key === 'Delete') && E.sel) { e.preventDefault(); selAction('del'); return; }
    if (e.key === 'Escape') clearSelection();
  });
  window.addEventListener('resize', () => { if (E.open) { const ns = fitScale(); if (E.s < ns * 1.02 && E.s > ns * 0.6) setScale(ns); else scheduleRerender(); } });
}

/* =====================================================================
   SETTINGS + BACKUP
   ===================================================================== */
function abToB64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToAb(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
async function settingsDialog() {
  let est = '';
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); est = `${(e.usage / 1048576).toFixed(1)} MB used on this device`; } } catch (e) {}
  const body = document.createElement('div');
  const draw = () => {
    body.innerHTML = `
      <div class="switch-row"><div><div class="t">Draw with finger</div><div class="d">Off: Pencil draws, fingers scroll &amp; pinch. Turns off automatically when a Pencil is used.</div></div><button class="switch ${SET.fingerDraw ? 'on' : ''}" data-s="finger" aria-label="Draw with finger"></button></div>
      <div class="switch-row"><div><div class="t">Back up everything</div><div class="d">Save all folders, notes and PDFs to one file.</div></div><button class="btn" data-s="export">${icon('download')}Export</button></div>
      <div class="switch-row"><div><div class="t">Restore a backup</div><div class="d">Adds notes from a backup file.</div></div><button class="btn" data-s="import">${icon('upload')}Import</button></div>
      <p class="muted" style="margin-top:12px">${DB.mem ? '<b style="color:var(--danger)">Storage is unavailable in this browser — notes will be lost when the page closes.</b><br>' : ''}${est ? est + '. ' : ''}Notes live only in this browser on this device. On iPad, add Margin to your Home Screen and export a backup now and then.</p>`;
  };
  draw();
  body.addEventListener('click', async e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'finger') { SET.fingerDraw = !SET.fingerDraw; if (SET.fingerDraw) E.penSeen = false; saveSettings(); draw(); }
    if (b.dataset.s === 'export') exportBackup();
    if (b.dataset.s === 'import') importBackup();
  });
  modal({ title: 'Settings', body, wide: true, buttons: [{ label: 'Done', primary: true, value: true }] });
}
async function exportBackup() {
  const pg = progressBox('Creating backup');
  try {
    const folders = await DB.all('folders'), notes = await DB.all('notes'), pages = await DB.all('pages'), blobs = await DB.all('blobs');
    pg.set('Packing files…', 0.5);
    const data = { app: 'margin', version: 1, exported: now(), folders, notes, pages, blobs: blobs.map(b => ({ id: b.id, type: b.type, data: abToB64(b.data) })) };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    pg.close();
    const d = new Date();
    fileReadyBox(blob, `margin-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`, 'Backup');
  } catch (e) { pg.close(); toast('Backup failed: ' + (e.message || e)); }
}
async function importBackup() {
  const file = await pickFile($('#file-backup')); if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); if (data.app !== 'margin') throw new Error('not a Margin backup'); }
  catch (e) { toast('That isn’t a Margin backup file'); return; }
  if (!await confirmBox('Restore backup?', `Adds ${data.notes.length} note${data.notes.length === 1 ? '' : 's'} and ${data.folders.length} folder${data.folders.length === 1 ? '' : 's'}. Notes already here with the same ID will be replaced.`, 'Restore', false)) return;
  const pg = progressBox('Restoring');
  try {
    const total = data.blobs.length + data.notes.length + data.pages.length + data.folders.length; let i = 0;
    const tick = () => { i++; if (i % 10 === 0) pg.set(`${i} of ${total}`, i / total); };
    for (const b of data.blobs) { await DB.put('blobs', { id: b.id, type: b.type, data: b64ToAb(b.data) }); tick(); }
    for (const f of data.folders) { await DB.put('folders', f); tick(); }
    for (const p of data.pages) { await DB.put('pages', p); tick(); }
    for (const n of data.notes) { await DB.put('notes', n); tick(); }
    pg.close(); closeAllModals(); await refreshLib(); toast('Backup restored');
  } catch (e) { pg.close(); toast('Restore failed: ' + (e.message || e)); }
}
function closeAllModals() { $$('.modal-back').forEach(m => m.remove()); }

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  const ok = await DB.open();
  bindLibrary(); bindEditor(); bindDropAndPaste();
  await refreshLib();
  if (!ok) toast('This browser blocked storage — notes won’t be saved', 5000);
  await receiveSharedFiles();
  const m = location.hash.match(/^#note-(.+)$/);
  if (m) { const n = L.notes.find(x => x.id.replace(/[^A-Za-z0-9-]/g, '') === m[1]); if (n) openNote(n.id); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNote(); });
  window.addEventListener('pagehide', () => saveNote());
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.__margin = { E, L, DB, SET, openNote, closeNote, setTool, exportPdf, buildPdf, fileToPages, ingestFiles };
}
boot();
})();
